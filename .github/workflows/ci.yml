name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit rather than a tag. A tag moves, and a moving third-party
      # action is an unpinned dependency with write access to the build (Dependabot keeps the pins
      # from going stale, see .github/dependabot.yml).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Repo hygiene
        run: |
          set -e
          test -f README.md
          test -f LICENSE
          test -f CONTRIBUTING.md
          test -f docs/adr/0001-record-architecture-decisions.md
          echo "hygiene OK"

      - name: Install
        run: npm ci

      - name: Formatting
        # prettier was a dependency that nothing enforced: `npm run prettier` writes, and no check
        # read. Formatting drift is trivial on its own and makes every later diff noisier than the
        # change it carries.
        run: npx prettier --check startos

      - name: Types
        run: npx tsc --noEmit

      - name: Workflows parse
        # Deliberately not actionlint. It would be the obvious tool, and adopting it means trusting
        # a third-party binary that we cannot verify to the standard TOOLCHAIN.md sets for
        # `start-cli`, which would make the toolchain rule mean less than it does. This uses the
        # `yaml` parser already in the tree and catches the failure that actually strands a run: a
        # workflow that does not parse.
        run: |
          node -e '
            const YAML = require("yaml"), fs = require("fs");
            const files = [
              ".github/workflows/ci.yml",
              ".github/workflows/release.yml",
              ".github/actions/build-s9pk/action.yml",
              ".github/dependabot.yml",
            ];
            for (const f of files) {
              YAML.parse(fs.readFileSync(f, "utf8"));
              console.log("parses:", f);
            }
          '

  build-s9pk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # Everything that verifies start-cli and prepares the build environment lives in this action,
      # so the release workflow runs exactly the same steps. It did not, and would have failed on
      # the first tag.
      - uses: ./.github/actions/build-s9pk
        with:
          s9pk-build-key: ${{ secrets.S9PK_BUILD_KEY }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: s9pk
          path: '*.s9pk'
          if-no-files-found: error

  no-internal-refs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Guard against infra leakage
        run: |
          if git grep -nIE '192\.168\.[0-9]|(^|[^0-9.])10(\.[0-9]{1,3}){3}|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]|/home/|/data/|[a-z2-7]{16,56}\.onion' -- . ':!.github/workflows/ci.yml'; then
            echo "::error::Internal infra reference (IP / local path / onion) found in a tracked file."
            exit 1
          fi
          echo "no internal refs"
